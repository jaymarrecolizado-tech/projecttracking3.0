name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pint
        run: php vendor/bin/pint --test

      - name: PHPStan (larastan, level 6)
        run: php vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: php artisan test --compact

      # Audit is blocking: the tree carries no known advisories (verified on
      # the Laravel 12 upgrade). Keep it that way.
      - name: Security audit
        run: composer audit

  # F1: the suite must also pass on the engine production ships — MySQL 8
  # with its default strict modes. Credentials mirror phpunit.mysql.xml.
  php-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: pred_tracking_mysql_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # F1: assert MySQL 8's strict modes rather than inheriting them from the
      # image tag, which could silently loosen on a future bump. SET GLOBAL
      # applies to the fresh connection each test opens.
      - name: Pin MySQL 8 strict modes
        run: |
          mysql -h 127.0.0.1 -u root -e "SET GLOBAL sql_mode='ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';"
          mysql -h 127.0.0.1 -u root -e "SELECT @@GLOBAL.sql_mode;"

      - name: Tests on MySQL
        run: php vendor/bin/phpunit --compact -c phpunit.mysql.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (zero warnings allowed)
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --omit=dev

  public-web:
    # The Next.js public surface (Plan_UI.md Part II). It is a separate npm
    # project with its own lockfile, so the `frontend` job above does not cover
    # it -- without this job nothing in CI would ever compile the app.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --omit=dev
