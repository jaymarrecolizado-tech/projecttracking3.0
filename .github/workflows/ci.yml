name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pint
        run: php vendor/bin/pint --test

      - name: PHPStan (larastan, level 5)
        run: php vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: php artisan test --compact

      # Non-blocking: laravel/framework 11.x carries advisories fixable only
      # on 12.x (see Plan.md dependency track). Signal, don't gate, until the
      # Laravel 12 upgrade lands — then drop continue-on-error.
      - name: Security audit
        run: composer audit
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (zero warnings allowed)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --omit=dev
