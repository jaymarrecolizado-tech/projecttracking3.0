# Supervisor unit for the Next.js public surface (Plan_UI.md Part II §10).
#
# The same pattern as `fpiap-worker.conf`. A dead worker here means /s/* falls
# back to the Inertia survey via the nginx error page — which is the intended
# rollback, not a silent outage. See docs/DEPLOY.md §3.1.
#
# Paths are placeholders — set them to wherever the app is deployed, and note
# that this is a *second* runtime: the Node process must be able to reach
# LARAVEL_BASE_URL, which should be the public origin, not 127.0.0.1, because
# Laravel mints the signed submit URL from APP_URL.

[program:freewifi-public-web]
command=/usr/bin/node /var/www/fpiap-app/public-web/.next/standalone/server.js
directory=/var/www/fpiap-app/public-web
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1

; The Next server writes nothing to stdout that is not an error or a request
; line, so the rotation policy can be the same as the queue worker's.
stdout_logfile=/var/log/supervisor/freewifi-public-web.log
stderr_logfile=/var/log/supervisor/freewifi-public-web.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
