# nginx split for the Next.js public surface (Plan_UI.md Part II §10).
#
# Drop this `location` block ABOVE the existing Laravel `location /` in the
# site's server block. `/s/*` goes to the Node process; everything else —
# including `/api/*` — stays on Laravel, unchanged.
#
# This file is the whole cut-over. Flipping back is deleting the block and
# reloading nginx: no Laravel deploy, no data migration, nothing to unwind.
# See Plan_UI.md Part II §12.

upstream freewifi_public_web {
    server 127.0.0.1:3010;
    keepalive 8;
}

server {
    # ... server_name, ssl_certificate, root and the rest as you have them ...

    # --- Next.js public surface -------------------------------------------
    # Order matters: the three API routes the browser posts to must stay on
    # Laravel even though they live under the same prefix as the page.
    location /api/public/surveys {
        try_files $uri @laravel;
    }

    location /s/ {
        proxy_pass http://freewifi_public_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # If Node is down, fall through to Laravel's Inertia survey rather than
        # showing a 502. The rollback is then automatic, not a page reload
        # during an incident. Laravel already serves /s/{siteCode}.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 = @laravel_survey;
    }

    location @laravel_survey {
        # Re-enter the Laravel app for the survey path. Adjust to match how your
        # existing block names the PHP upstream.
        try_files $uri @laravel;
    }

    # --- existing Laravel app --------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }
}
