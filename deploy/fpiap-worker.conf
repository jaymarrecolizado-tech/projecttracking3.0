; FPIAP FreeWiFi Monitor — queue worker supervision (Plan.md gap #2).
; Copy to /etc/supervisor/conf.d/fpiap-worker.conf (or the CloudPanel
; supervisor drop-in) and replace <site-user>/<site> with the VPS values,
; then `supervisorctl reread && supervisorctl update`.
; Matches docs/DEPLOY.md §3: --max-time=3600 recycles the worker hourly so
; it can never run stale code long; deploy.sh ends with queue:restart.

[program:fpiap-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/<site-user>/htdocs/<site>/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/home/<site-user>/htdocs/<site>
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/home/<site-user>/logs/fpiap-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
